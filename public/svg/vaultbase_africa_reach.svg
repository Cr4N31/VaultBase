<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  
<style>
  .outline {
    fill: none;
    stroke: #ffed00;
    stroke-width: 2;
    stroke-dasharray: 3203.6;
    animation: draw-outline 7s ease-in-out infinite alternate;
  }
  .ray {
    fill: none;
    stroke: #ffed00;
    stroke-width: 1.4;
    stroke-linecap: round;
    opacity: 0.85;
  }
  .ray-0 { stroke-dasharray: 220.4; animation: draw-ray-0 7s ease-in-out infinite alternate; }.ray-1 { stroke-dasharray: 136.3; animation: draw-ray-1 7s ease-in-out infinite alternate; }.ray-2 { stroke-dasharray: 462.0; animation: draw-ray-2 7s ease-in-out infinite alternate; }.ray-3 { stroke-dasharray: 415.0; animation: draw-ray-3 7s ease-in-out infinite alternate; }.ray-4 { stroke-dasharray: 434.4; animation: draw-ray-4 7s ease-in-out infinite alternate; }.ray-5 { stroke-dasharray: 320.5; animation: draw-ray-5 7s ease-in-out infinite alternate; }.ray-6 { stroke-dasharray: 256.9; animation: draw-ray-6 7s ease-in-out infinite alternate; }.ray-7 { stroke-dasharray: 319.4; animation: draw-ray-7 7s ease-in-out infinite alternate; }
  .nigeria-dot {
    fill: #ffed00;
    animation: nigeria-pulse 2.4s ease-in-out infinite;
  }
  
@keyframes draw-outline {
  0%   { stroke-dashoffset: 3203.6; }
  38%  { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; }
}
@keyframes draw-ray-0 {
  0% { stroke-dashoffset: 220.4; }
  42.0% { stroke-dashoffset: 220.4; }
  62.0% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; }
}
@keyframes draw-ray-1 {
  0% { stroke-dashoffset: 136.3; }
  47.43% { stroke-dashoffset: 136.3; }
  67.43% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; }
}
@keyframes draw-ray-2 {
  0% { stroke-dashoffset: 462.0; }
  52.86% { stroke-dashoffset: 462.0; }
  72.86% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; }
}
@keyframes draw-ray-3 {
  0% { stroke-dashoffset: 415.0; }
  58.29% { stroke-dashoffset: 415.0; }
  78.29% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; }
}
@keyframes draw-ray-4 {
  0% { stroke-dashoffset: 434.4; }
  63.71% { stroke-dashoffset: 434.4; }
  83.71% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; }
}
@keyframes draw-ray-5 {
  0% { stroke-dashoffset: 320.5; }
  69.14% { stroke-dashoffset: 320.5; }
  89.14% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; }
}
@keyframes draw-ray-6 {
  0% { stroke-dashoffset: 256.9; }
  74.57% { stroke-dashoffset: 256.9; }
  94.57% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; }
}
@keyframes draw-ray-7 {
  0% { stroke-dashoffset: 319.4; }
  80.0% { stroke-dashoffset: 319.4; }
  100% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; }
}
@keyframes nigeria-pulse {
  0%, 100% { r: 6; opacity: 0.9; }
  50%      { r: 9; opacity: 0.5; }
}
</style>

