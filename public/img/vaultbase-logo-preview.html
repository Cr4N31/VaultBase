<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VaultBase Wordmark — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Sora:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050505;
    font-family: 'Sora', sans-serif;
    padding: 60px 40px;
    color: #888;
  }
  .block {
    max-width: 720px;
    margin: 0 auto 70px auto;
  }
  .label {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 14px;
  }
  .wordmark {
    display: flex;
    align-items: center;
    padding: 60px 48px;
    border-radius: 6px;
  }
  .wm-text {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 64px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .dot {
    width: 14px;
    height: 14px;
    background: #ffed00;
    margin-left: 10px;
    align-self: flex-end;
    margin-bottom: 6px;
  }
  .row { display: flex; align-items: flex-end; }
  .bg-black { background: #0A0A0A; }
  .bg-white { background: #FFFFFF; }
  .text-white { color: #FFFFFF; }
  .text-black { color: #0A0A0A; }
</style>
</head>
<body>

  <div class="block">
    <div class="label">Primary — dark backgrounds</div>
    <div class="wordmark bg-black">
      <div class="row">
        <div class="wm-text text-white">vaultbase</div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <div class="block">
    <div class="label">Reversed — light backgrounds</div>
    <div class="wordmark bg-white">
      <div class="row">
        <div class="wm-text text-black">vaultbase</div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <div class="block">
    <div class="label">Monochrome — small sizes, stamps, favicons</div>
    <div class="wordmark bg-black">
      <div class="wm-text text-white">vaultbase</div>
    </div>
  </div>

  <div class="block">
    <div class="label">At small scale (nav bar test)</div>
    <div class="wordmark bg-black" style="padding: 20px 28px;">
      <div class="row">
        <div class="wm-text text-white" style="font-size: 28px;">vaultbase</div>
        <div class="dot" style="width: 6px; height: 6px; margin-left: 5px; margin-bottom: 3px;"></div>
      </div>
    </div>
  </div>

</body>
</html>
